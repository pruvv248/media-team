<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Why not join the Media Team?</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--gold:#FFB800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:2.2vh}
.hidden{display:none}
.brush{font-family:"Permanent Marker","Brush Script MT",cursive;color:var(--gold);font-size:clamp(22px,5vw,38px);transform:rotate(-3deg);margin:0}
h1{margin:0;font-weight:400;text-transform:uppercase;line-height:.92;font-size:clamp(46px,13vw,150px);letter-spacing:.01em}
h1 span{color:var(--gold)}
.sub{margin:0;font-family:system-ui,sans-serif;font-size:clamp(15px,2.4vw,20px);color:#cfcfcf;max-width:34ch}
.sign{position:relative;margin-top:2vh;border:0;cursor:pointer;background:var(--gold);color:#000;font:inherit;text-transform:uppercase;font-size:clamp(40px,11vw,96px);line-height:1;padding:.28em .7em .22em;border-radius:14px;transform:rotate(-2deg);box-shadow:0 0 0 6px #000,0 0 0 10px var(--gold),0 0 60px 8px rgba(255,184,0,.45);animation:pulse 1.3s ease-in-out infinite}
.sign:hover{transform:rotate(0) scale(1.06)}
.sign:focus-visible,.back:focus-visible{outline:4px solid #fff;outline-offset:8px}
.sign:active{transform:scale(.96)}
@keyframes pulse{50%{box-shadow:0 0 0 6px #000,0 0 0 10px var(--gold),0 0 110px 26px rgba(255,184,0,.7)}}
.rays{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,184,0,.10) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle at 50% 62%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 62%,#000,transparent 70%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view>*:not(.rays){position:relative}
.flash{position:fixed;inset:0;background:var(--gold);opacity:0;pointer-events:none}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#reveal img{width:min(94vw,1100px);max-height:80vh;object-fit:contain;border-radius:10px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.back{background:none;border:2px solid #555;color:#bbb;border-radius:999px;padding:.55em 1.3em;font:16px system-ui,sans-serif;cursor:pointer}
.back:hover{border-color:var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:reduce){.sign,.rays,.flash.go,#reveal img{animation:none}}
</style></head>
<body>
<main id="start" class="view">
  <div class="rays" aria-hidden="true"></div>
  <p class="brush">Psst... you've been picked.</p>
  <h1>Something<br><span>big</span> is waiting</h1>
  <p class="sub">It takes one click. You won't want to miss this.</p>
  <button class="sign" id="go" type="button">Click here</button>
</main>
